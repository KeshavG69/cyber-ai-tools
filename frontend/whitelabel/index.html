<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2310b981' d='M12 2l8 3v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5z'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>SoldierIQ Cyber</title>
    <style>
      [aria-label="Open Strix Cloud"],
      [aria-label="Upgrade your plan"] { display: none !important; }
    </style>
    <script type="module" crossorigin src="./assets/index-B94ANU8d.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DN__rVv3.css">
    <script>
    (function () {
      var BRAND = "SoldierIQ Cyber";

      // Brand-agnostic: exact nav labels to remove (no "Strix" in them)
      var HIDE_EXACT = ["PR Security Reviews", "Integrations", "Members", "Feedback & support"];

      // Brand-agnostic patterns for upsell/cloud/auth bits. Matched ONLY on leaf
      // elements (no element children) so we never hide a big container by accident.
      var HIDE_PATTERNS = [
        /\bcloud also includes\b/i,
        /\btry .*enterprise\b/i,
        /\bopen .*cloud\b/i,
        /\bupgrade your plan\b/i,
        /\blinked email\b/i,
        /\bforget this email\b/i,
        /\bcontinue with (email|google|github)\b/i,
        /^sign (in|up)$/i
      ];

      function isStrix(u) { return !!u && /strix\.ai/i.test(u); }
      function norm(el) { return (el.textContent || "").replace(/\s+/g, " ").trim(); }
      function isLeaf(el) { return el.children.length === 0; }

      function hideUp(el) {
        var t = el.closest('button, a, li, [role="button"]') || el;
        t.style.display = "none";
      }

      // Remove the whole "Run your next pentest in ... Cloud" upsell card.
      // Find the CTA button, climb to the card wrapper, hide it.
      function hideCloudUpsell() {
        var btns = document.querySelectorAll('button, a, [role="button"]');
        for (var i = 0; i < btns.length; i++) {
          var b = btns[i], bt = norm(b);
          if (!/run a pentest in .*cloud/i.test(bt) && !/^run in the cloud/i.test(bt)) continue;
          var node = b, target = b;
          for (var k = 0; k < 6 && node.parentElement; k++) {
            node = node.parentElement;
            var pt = norm(node);
            if (/^run your next pentest in .*cloud/i.test(pt) || /^run in the cloud/i.test(pt)) target = node;
            if (pt.length > 260) break; // stop before swallowing unrelated layout
          }
          target.style.display = "none";
        }
      }

      // Remove the "Verify your email with a one-time code" gate on Past runs.
      function hideEmailGate() {
        var btns = document.querySelectorAll('button, a, [role="button"]');
        for (var i = 0; i < btns.length; i++) {
          var b = btns[i];
          if (!/send me a code/i.test(norm(b))) continue;
          var node = b, target = b;
          for (var k = 0; k < 8 && node.parentElement; k++) {
            node = node.parentElement;
            var pt = norm(node);
            if (/^browse every run/i.test(pt) || /verify your email/i.test(pt)) target = node;
            if (pt.length > 500) break;
          }
          target.style.display = "none";
        }
        // belt-and-suspenders: hide any stray email input + its row
        var emails = document.querySelectorAll('input[type="email"]');
        for (var j = 0; j < emails.length; j++) {
          var row = emails[j].closest('form, div') || emails[j];
          row.style.display = "none";
        }
      }

      function neutralizeStrixLinks() {
        var links = document.querySelectorAll('a[href]');
        for (var i = 0; i < links.length; i++) {
          var a = links[i];
          if (isStrix(a.getAttribute('href'))) {
            a.removeAttribute('href');
            a.removeAttribute('target');
            a.style.cursor = 'default';
          }
        }
      }

      function rebrandText(root) {
        var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
        var tn, list = [];
        while ((tn = w.nextNode())) list.push(tn);
        list.forEach(function (n) {
          var v = n.nodeValue;
          if (!v || v.indexOf("Strix") < 0) return;
          if (n.parentElement && n.parentElement.closest("code, pre")) return; // keep CLI samples
          var nv = v.replace(/\bStrix\b/g, BRAND);
          if (nv !== v) n.nodeValue = nv;
        });
      }

      function apply() {
        try { document.title = BRAND; } catch (e) {}

        // 1) remove the cloud upsell card first (before any rebrand)
        hideCloudUpsell();

        // 2) exact nav labels + leaf-only upsell patterns
        var nodes = document.querySelectorAll('button, a, span, p, h1, h2, h3, li');
        for (var i = 0; i < nodes.length; i++) {
          var el = nodes[i], t = norm(el);
          if (!t) continue;
          if (HIDE_EXACT.indexOf(t) >= 0) { hideUp(el); continue; }
          if (!isLeaf(el)) continue; // patterns only on text leaves
          for (var j = 0; j < HIDE_PATTERNS.length; j++) {
            if (HIDE_PATTERNS[j].test(t)) { hideUp(el); break; }
          }
        }

        // 3) kill any escape hatch to strix.ai, then rebrand remaining text
        neutralizeStrixLinks();
        rebrandText(document.body);
      }

      // Backstops: block navigation to any strix.ai page.
      document.addEventListener('click', function (e) {
        var a = e.target && e.target.closest && e.target.closest('a');
        if (!a) return;
        var h = a.getAttribute('href') || (a.dataset && a.dataset.href) || '';
        if (isStrix(h)) { e.preventDefault(); e.stopPropagation(); }
      }, true);
      var _open = window.open;
      window.open = function (u) { if (isStrix(u)) return null; return _open.apply(window, arguments); };

      function boot() {
        apply();
        try {
          new MutationObserver(function () { apply(); })
            .observe(document.body, { childList: true, subtree: true, characterData: true });
        } catch (e) {}
      }
      if (document.readyState === "loading")
        document.addEventListener("DOMContentLoaded", boot);
      else boot();
    })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
